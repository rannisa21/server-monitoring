{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>Add User</h2>
    <div class="header-actions">
        <a href="{{ url_for('user_management.user_management') }}" class="btn btn-secondary">&laquo; Back to Users</a>
    </div>
</div>

<div class="card" style="max-width: 500px;">
    <div class="card-header">
        <h3>User Details</h3>
    </div>
    <form method="post" class="card-body">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                name="username"
                id="username"
                required
                minlength="3"
                maxlength="64"
                pattern="[a-zA-Z0-9_]+"
                title="Only letters, numbers, and underscores allowed"
                placeholder="Enter username"
            />
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="password" required minlength="8" placeholder="Min 8 characters" />
                <button type="button" class="toggle-password" onclick="togglePassword('password')" title="Show/Hide Password">
                    <span class="eye-icon">⌣</span>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" name="confirm_password" id="confirm_password" required minlength="8" placeholder="Ulangi password" />
                <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')" title="Show/Hide Password">
                    <span class="eye-icon">⌣</span>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="role">Role</label>
            <select name="role" id="role" required>
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add User</button>
            <a href="{{ url_for('user_management.user_management') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
