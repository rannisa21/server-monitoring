{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h2>Edit User</h2>
</div>

<div class="card" style="max-width: 500px;">
    <div class="card-header">
        <h3>Edit User: {{ user.username }}</h3>
    </div>
    <form method="post" class="card-body">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                name="username"
                id="username"
                value="{{ user.username }}"
                required
                minlength="3"
                maxlength="64"
                pattern="[a-zA-Z0-9_]+"
                title="Only letters, numbers, and underscores allowed"
            />
        </div>
        
        <div class="form-group">
            <label for="password">Password Baru (kosongkan jika tidak diubah)</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="password" minlength="8" placeholder="Min 8 karakter" />
                <button type="button" class="toggle-password" onclick="togglePassword('password')" title="Show/Hide Password">
                    <span class="eye-icon">⌣</span>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Konfirmasi Password Baru</label>
            <div class="password-wrapper">
                <input type="password" name="confirm_password" id="confirm_password" minlength="8" placeholder="Ulangi password baru" />
                <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')" title="Show/Hide Password">
                    <span class="eye-icon">⌣</span>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="role">Role</label>
            <select name="role" id="role" required>
                <option value="user" {% if user.role.value == 'user' %}selected{% endif %}>User</option>
                <option value="admin" {% if user.role.value == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update User</button>
            <a href="{{ url_for('user_management.user_management') }}" class="btn btn-secondary">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
