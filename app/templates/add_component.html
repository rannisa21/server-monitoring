{% extends 'base.html' %} {% block content %}
<div class="page-header">
  <h2>Add Component</h2>
  <div class="header-actions">
    <a href="{{ url_for('component.components', server_id=server.id) }}" class="btn btn-secondary">&laquo; Back to Components</a>
  </div>
</div>

<div class="server-info-card">
  <p>
    <strong>Server:</strong> {{ server.name }} |
    <strong>IP:</strong> {{ server.ip }} |
    <strong>Brand:</strong> {{ server.brand }}
  </p>
</div>

<div class="card" style="max-width: 500px;">
  <div class="card-header">
    <h3>Component Details</h3>
  </div>
  <form method="post" class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="form-group">
      <label for="category">Category</label>
      <select name="category" id="category" required>
        <option value="">- Select Category -</option>
        <option value="PSU">PSU (Power Supply Unit)</option>
        <option value="harddisk">Harddisk</option>
        <option value="suhu">Suhu (Temperature)</option>
        <option value="fan">Fan</option>
      </select>
    </div>

    <div class="form-group">
      <label for="name">Component Name</label>
      <input
        type="text"
        name="name"
        id="name"
        required
        placeholder=""
      />
    </div>

    <div class="form-group">
      <label for="oid">OID (SNMP Object Identifier)</label>
      <input
        type="text"
        name="oid"
        id="oid"
        required
        placeholder=""
      />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save & Start Monitoring</button>
      <a
        href="{{ url_for('component.components', server_id=server.id) }}"
        class="btn btn-secondary"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %}
