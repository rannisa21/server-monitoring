{% extends 'base.html' %} {% block content %}
<div class="page-header">
  <h2>Add Server</h2>
  <div class="header-actions">
    <a href="{{ url_for('server.servers') }}" class="btn btn-secondary">&laquo; Back to Servers</a>
  </div>
</div>

<div class="card" style="max-width: 500px;">
  <div class="card-header">
    <h3>Server Details</h3>
  </div>
  <form method="post" class="card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-group">
      <label for="name">Server Name</label>
      <input
        type="text"
        name="name"
        id="name"
        required
        placeholder=""
      />
    </div>
    <div class="form-group">
      <label for="ip">IP Address</label>
      <input
        type="text"
        name="ip"
        id="ip"
        required
        placeholder=""
      />
    </div>
    <div class="form-group">
      <label for="brand">Brand</label>
      <select name="brand" id="brand" required>
        <option value="">- Select Brand -</option>
        <option value="HPE">HPE</option>
        <option value="Dell">Dell</option>
        <option value="supermicro">Supermicro</option>
        <option value="Lenovo">Lenovo</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="form-group">
      <label for="snmp_version">SNMP Version</label>
      <select
        name="snmp_version"
        id="snmp_version"
        required
        onchange="toggleSnmpFields()"
      >
        <option value="">- Select SNMP Version-</option>
        <option value="v2c">v2c</option>
        <option value="v3">v3</option>
      </select>
    </div>
    <div class="form-group" id="community-group" style="display: none">
      <label for="community">Community</label>
      <input
        type="text"
        name="community"
        id="community"
        placeholder=""
      />
    </div>
    <div id="snmpv3-fields" style="display: none">
      <div class="form-group">
        <label for="snmp_auth_user">Auth User</label>
        <input type="text" name="snmp_auth_user" id="snmp_auth_user" />
      </div>
      <div class="form-group">
        <label for="snmp_auth_pass">Auth Password</label>
        <div class="password-wrapper">
          <input type="password" name="snmp_auth_pass" id="snmp_auth_pass" />
          <button type="button" class="toggle-password" onclick="togglePassword('snmp_auth_pass')" title="Show/Hide Password">
            <span class="eye-icon">⌣</span>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="snmp_priv_pass">Priv Password</label>
        <div class="password-wrapper">
          <input type="password" name="snmp_priv_pass" id="snmp_priv_pass" />
          <button type="button" class="toggle-password" onclick="togglePassword('snmp_priv_pass')" title="Show/Hide Password">
            <span class="eye-icon">⌣</span>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="snmp_auth_proto">Auth Protocol</label>
        <select name="snmp_auth_proto" id="snmp_auth_proto">
          <option value="SHA-256">SHA-256</option>
        </select>
      </div>    
      <div class="form-group">
        <label for="snmp_priv_proto">Priv Protocol</label>
        <select name="snmp_priv_proto" id="snmp_priv_proto">
          <option value="AES">AES</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Server</button>
      <a href="{{ url_for('server.servers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

<script>
  function toggleSnmpFields() {
    var version = document.getElementById("snmp_version").value;
    var v3Fields = document.getElementById("snmpv3-fields");
    var communityGroup = document.getElementById("community-group");
    if (version === "v3") {
      v3Fields.style.display = "block";
      communityGroup.style.display = "none";
    } else if (version === "v2c") {
      v3Fields.style.display = "none";
      communityGroup.style.display = "block";
    } else {
      v3Fields.style.display = "none";
      communityGroup.style.display = "none";
    }
  }
  document.addEventListener("DOMContentLoaded", toggleSnmpFields);
</script>
{% endblock %}
